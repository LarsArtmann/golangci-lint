version: "2"
run:
    timeout: 5m
    go: 1.26.2
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
output:
    formats: {}
linters:
    enable:
        - bodyclose
        - contextcheck
        - copyloopvar
        - cyclop
        - depguard
        - dogsled
        - dupl
        - durationcheck
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godox
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - ineffassign
        - interfacebloat
        - intrange
        - loggercheck
        - maintidx
        - mirror
        - misspell
        - mnd
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - noctx
        - nolintlint
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - testifylint
        - thelper
        - unconvert
        - unparam
        - unused
        - usetesting
        - wastedassign
        - whitespace
        - wrapcheck
        - zerologlint
    default: none
    settings:
        depguard:
            rules:
                logger:
                    deny:
                        - desc: logging is allowed only by logutils.Log.
                          pkg: github.com/sirupsen/logrus
                        - desc: Should be replaced by standard lib errors package.
                          pkg: github.com/pkg/errors
                        - desc: It's a fork of github.com/stretchr/testify.
                          pkg: github.com/instana/testify
                    files:
                        - '!**/pkg/logutils/**.go'
        dupl:
            threshold: 100
        errorlint:
            asserts: false
        funlen:
            lines: -1
            statements: 50
        goconst:
            min-len: 2
            min-occurrences: 3
        gocritic:
            disabled-checks:
                - dupImport
                - ifElseChain
                - octalLiteral
                - whyNoLint
            enabled-tags:
                - diagnostic
                - experimental
                - opinionated
                - performance
                - style
        gocyclo:
            min-complexity: 15
        godox:
            keywords:
                - FIXME
        govet:
            enable:
                - nilness
                - shadow
            settings:
                printf:
                    funcs:
                        - (github.com/golangci/golangci-lint/v2/pkg/logutils.Log).Infof
                        - (github.com/golangci/golangci-lint/v2/pkg/logutils.Log).Warnf
                        - (github.com/golangci/golangci-lint/v2/pkg/logutils.Log).Errorf
                        - (github.com/golangci/golangci-lint/v2/pkg/logutils.Log).Fatalf
        lll:
            line-length: 140
        misspell:
            ignore-rules:
                - importas
            locale: US
        mnd:
            checks:
                - argument
                - case
                - condition
                - return
            ignored-functions:
                - strings.SplitN
            ignored-numbers:
                - "0"
                - "1"
                - "2"
                - "3"
        nolintlint:
            allow-unused: false
            require-explanation: true
            require-specific: true
        revive:
            rules:
                - name: indent-error-flow
                - disabled: true
                  name: unexported-return
                - name: unused-parameter
                - name: unused-receiver
    exclusions:
        presets:
            - comments
            - std-error-handling
            - common-false-positives
            - legacy
        rules:
            - path: (.+)_test\.go
              linters:
                - dupl
                - mnd
                - lll
                - goconst
            - path: pkg/commands/internal/migrate/.+
              linters:
                - goconst
            - path: scripts/website/dump_info/thanks.go
              linters:
                - goconst
            - path: pkg/result/processors/.+
              text: string `(go\.mod|errcheck|revive|gosec|error|high)` has \d+ occurrences, make it a constant
              linters:
                - goconst
            - path: pkg/commands/.+
              text: string `(\(devel\)|unknown)` has \d+ occurrences, make it a constant
              linters:
                - goconst
            - path: pkg/printers/.+
              text: string `(golangci-lint|warning)` has \d+ occurrences, make it a constant
              linters:
                - goconst
            - path: pkg/config/output(_test)?.go
              text: string `(file|linter|severity)` has \d+ occurrences, make it a constant
              linters:
                - goconst
            - path: pkg/golinters/unused/unused.go
              text: 'rangeValCopy: each iteration copies 160 bytes \(consider pointers or indexing\)'
              linters:
                - gocritic
            - path: test/bench/bench_test.go
              text: 'G115: integer overflow conversion uint64 -> int'
              linters:
                - gosec
            - path: scripts/website/expand_templates/linters_test.go
              text: 'G306: Expect WriteFile permissions to be 0600 or less'
              linters:
                - gosec
            - text: '(G704: SSRF via taint analysis|G703: Path traversal via taint analysis|G702: Command injection via taint analysis|G115: integer overflow conversion uintptr)'
              linters:
                - gosec
            - path: pkg/commands/internal/migrate/two/
              linters:
                - lll
            - path: pkg/commands/internal/migrate/
              text: 'hugeParam:'
              linters:
                - gocritic
            - path: pkg/commands/(formatters|linters).go
              linters:
                - dupl
            - path: pkg/lint/lintersdb/builder_linter.go
              text: 'SA1019: wsl.NewV4 is deprecated: use NewV5 instead.'
              linters:
                - staticcheck
            - path: pkg/golinters/wsl/wsl.go
              text: 'SA1019: config.WSLv4Settings is deprecated: use WSLv5Settings instead.'
              linters:
                - staticcheck
            - path: pkg/golinters/gomodguard/gomodguard.go
              text: 'SA1019: config.GoModGuardSettings is deprecated: use GoModGuardv2Settings instead.'
              linters:
                - staticcheck
            - path: pkg/golinters/gomodguard/
              linters:
                - dupl
        paths:
            - test/testdata_etc
            - internal/go
            - internal/x
            - pkg/goformatters/gci/internal
            - pkg/goanalysis/runner_checker.go
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
        - swaggo
    settings:
        gofmt:
            rewrite-rules:
                - pattern: interface{}
                  replacement: any
        goimports:
            local-prefixes:
                - github.com/golangci/golangci-lint/v2
    exclusions:
        paths:
            - test/testdata_etc
            - internal/go
            - internal/x
            - pkg/goformatters/gci/internal
            - pkg/goanalysis/runner_checker.go
issues: {}
